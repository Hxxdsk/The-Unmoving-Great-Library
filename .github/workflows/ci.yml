name: Toolbox validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest
      - if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=offscreen python -m pytest -q
      - if: runner.os == 'Windows'
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-check.json'
          $exe = Join-Path $pwd '启动工具箱.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--check-only', ('"' + $output + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $output; throw 'Native environment check failed' }
          $result = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $result.ready) { throw 'Native launcher reported an unready environment' }
          $gui = Start-Process -FilePath $exe -PassThru
          $hub = $null
          try {
            for ($n = 0; $n -lt 120; $n++) {
              Start-Sleep -Milliseconds 250
              $gui.Refresh()
              if ($gui.HasExited) { break }
              if ($gui.MainWindowHandle -ne 0) { throw 'Healthy runtime unexpectedly showed the preparation window' }
            }
            if (-not $gui.HasExited -or $gui.ExitCode -ne 0) { throw 'Native launcher did not hand off successfully' }
            $child = Get-CimInstance Win32_Process | Where-Object {
              $_.ParentProcessId -eq $gui.Id -and $_.CommandLine -like '*suite_entry.py*'
            } | Select-Object -First 1
            if (-not $child) { throw 'Toolbox child process was not created' }
            $hub = Get-Process -Id $child.ProcessId
            for ($n = 0; $n -lt 30; $n++) {
              Start-Sleep -Milliseconds 500
              $hub.Refresh()
              if ($hub.HasExited) { throw 'Toolbox child exited unexpectedly' }
              if ($hub.MainWindowHandle -ne 0) { break }
            }
            if ($hub.MainWindowHandle -eq 0) { throw 'Toolbox window was not created' }
            $null = $hub.CloseMainWindow()
            if (-not $hub.WaitForExit(10000)) { throw 'Toolbox did not close cleanly' }
            if ($hub.ExitCode -ne 0) { throw 'Toolbox exited with an error' }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
            if ($hub -and -not $hub.HasExited) { Stop-Process -Id $hub.Id -Force }
          }
  native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - working-directory: launcher
        run: go test ./...
      - working-directory: launcher
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags '-H=windowsgui -s -w' -o /tmp/toolbox.exe .
