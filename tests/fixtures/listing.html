<!doctype html><html><head><meta charset="utf-8"><style>
body{font:16px sans-serif} section{border:1px solid #ddd;padding:10px;margin:12px}img{width:65px;height:65px}input[type=file]{display:none}.spec{display:inline-block;padding:6px;border:1px solid #eee}#dialog{position:fixed;inset:50px;background:#fff;padding:20px;border:2px solid #999}button{padding:8px}td{border:1px solid #ccc;padding:5px}
#final-title{width:650px}.title-popover{width:680px;margin-left:64px}
#menu{display:none}#new-product:hover #menu{display:block}</style></head><body><div id="app"></div><div id="dialog" role="dialog" style="display:none"></div>
<script>
window.audit=[];window.saveReply=true;let stockMode='增';let amount=0;let wizardFiles=[];let detailFiles=[];let colors=['灰色','黑色'];let sizes=['L','XL','2XL'];let stock={};
const app=document.querySelector('#app'),dialog=document.querySelector('#dialog');
const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aJX8AAAAASUVORK5CYII=';
function picture(file,root){let wrap=document.createElement('span');wrap.className='picture';let img=new Image();img.src=pixel;img.dataset.filename=file;wrap.append(img);let del=document.createElement('button');del.setAttribute('aria-label','删除');del.textContent='删除';del.onclick=()=>wrap.remove();wrap.append(del);root.append(wrap)}
function upload(id,files){let root=document.querySelector('#'+id+' .photos');for(const f of files)picture(f.name,root);audit.push({event:'upload',field:id,files:[...files].map(f=>f.name)})}
function field(id,name,multiple=true){return `<section id="${id}"><label>${name}</label><div class="photos"></div><input type="file" ${multiple?'multiple':''} onchange="upload('${id}',this.files)"><button onclick="document.querySelector('#${id} .photos').innerHTML=''">清空</button></section>`}
function list(){app.innerHTML='<button style="display:none">新建商品</button><div id="new-product"><button>新建商品 ⌄</button><div id="menu"><button onclick="wizard()">单商品</button></div></div>'}
function wizard(){history.replaceState(null,'','/ffa/g/create');app.innerHTML='<input id="wizard" type="file" multiple onchange="wizardFiles=[...this.files];audit.push({event:\'wizard\',files:wizardFiles.map(f=>f.name)})"><button onclick="document.querySelector(\'#wizard\').click()">本地上传</button><button onclick="recommend()">下一步，生成商品</button>'}
function recommend(){app.innerHTML=field('wizard-main','商品主图')+field('wizard-detail','商品详情')+'<input placeholder="请输入商品标题" id="user-title"><label>AI推荐</label><button class="recommend" onclick="audit.push({event:\'title\',text:this.innerText})">网站推荐的第一个商品标题</button><button class="recommend">第二个推荐商品标题</button><button onclick="editor()">确认信息，继续生成</button>';for(const f of wizardFiles){picture(f.name,document.querySelector('#wizard-main .photos'));picture(f.name,document.querySelector('#wizard-detail .photos'))}}
function editor(){if(document.querySelector('#wizard-detail')){detailFiles=[...document.querySelectorAll('#wizard-detail img')].map(e=>e.dataset.filename);audit.push({event:'generation',details:detailFiles,title:document.querySelector('#user-title').value})}history.replaceState(null,'','/ffa/g/edit?id=12345');app.innerHTML='<nav><button>图文信息</button><button>属性信息</button><button>价格库存</button></nav>'+'<section id="editor-title"><label>商品标题</label><input id="final-title" value="短标题"><button onclick="titleRecommendations()">AI 推荐</button></section>'+field('main','主图')+field('portrait','主图3:4')+field('white','白底图',false)+field('detail','商品详情')+field('wash','水洗标/吊牌图')+'<section><label>货号</label><input id="sku"></section><section><label>发货模式</label><label><input type="radio" name="mode" checked>现货</label><label><input type="radio" name="shipping">次日发</label><label><input type="radio" name="shipping">48小时</label></section><section id="colors"><label>颜色分类</label><div class="items"></div></section><section id="sizes"><label>尺码大小</label><div class="items"></div><select role="combobox" aria-label="请选择尺码" onchange="addSize(this.value);this.value=\'\'"><option value="">请选择尺码</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option></select></section><section><label>尺码表</label><button onclick="sizeDialog()">AI解析尺码图</button></section><section id="prices"><label>价格与库存</label><input placeholder="价格" id="price"><div class="stock-mode"><button onclick="stockMode=\'增\'">增</button><button onclick="stockMode=\'减\'">减</button><input placeholder="现货库存" id="inventory"></div><button onclick="batch()">批量设置</button><table><thead><tr><th>颜色分类</th><th>尺码大小</th><th>SKU图</th><th>价格</th><th>现货库存</th></tr></thead><tbody></tbody></table></section><button onclick="saveDraft()">保存草稿</button><button id="recognize" onclick="audit.push({event:\'FORBIDDEN_PUBLISH\'})">发布商品</button>';
for(const file of wizardFiles)picture(file.name,document.querySelector('#main .photos'));
for(const file of detailFiles)picture(file,document.querySelector('#detail .photos'));
for(const color of colors)addSpec('colors',color);for(const size of sizes)addSpec('sizes',size);renderRows()}
function titleRecommendations(){let popup=document.createElement('div');popup.className='title-popover';popup.innerHTML='<div onclick="document.querySelector(\'#final-title\').value=this.innerText;audit.push({event:\'recommended-final-title\',text:this.innerText});this.parentElement.remove()">网站推荐的第一个完整商品标题</div><div>网站推荐的第二个商品标题</div><button>AI 重新生成</button>';document.querySelector('#editor-title').append(popup)}
function addSpec(id,name){let row=document.createElement('div');row.className='spec';row.dataset.value=name;row.innerHTML='<select><option>'+name+'</option></select><input placeholder="备注"><div class="photos"></div><input type="file"><button aria-label="删除">删除</button>';row.querySelector('[type=file]').onchange=e=>{for(const f of e.target.files)picture(f.name,row.querySelector('.photos'));audit.push({event:'specphoto',color:name,files:[...e.target.files].map(f=>f.name)})};row.querySelector('button').onclick=()=>{row.remove();renderRows()};document.querySelector('#'+id+' .items').append(row)}
function addSize(name){if(name && ![...document.querySelectorAll('#sizes .spec')].some(e=>e.dataset.value===name)){addSpec('sizes',name);renderRows()}}
function renderRows(){let body=document.querySelector('tbody');if(!body)return;body.innerHTML='';for(const c of document.querySelectorAll('#colors .spec'))for(const s of document.querySelectorAll('#sizes .spec')){let key=c.dataset.value+'-'+s.dataset.value;if(!(key in stock))stock[key]=1000;let tr=document.createElement('tr');tr.dataset.key=key;tr.innerHTML='<td>'+c.dataset.value+'</td><td>'+s.dataset.value+'</td><td>图</td><td><input class="rowprice" value="199"></td><td><span class="rowstock">'+stock[key]+'</span></td>';body.append(tr)}}
function batch(){let price=document.querySelector('#price').value,qty=document.querySelector('#inventory').value;for(const row of document.querySelectorAll('tbody tr')){if(price)row.querySelector('.rowprice').value=price;if(qty){let target=stock[row.dataset.key]+Number(qty)*(stockMode==='增'?1:-1);stock[row.dataset.key]=target;row.querySelector('.rowstock').textContent=target}}audit.push({event:'batch',price,qty,stockMode})}
function sizeDialog(){dialog.style.display='block';dialog.innerHTML='<label>AI解析尺码图</label><div class="photos"></div><input type="file"><button id="recognize" onclick="audit.push({event:\'site-size-ai\'});dialog.querySelector(\'#recognize\').textContent=\'使用识别结果\';dialog.querySelector(\'#recognize\').onclick=()=>dialog.style.display=\'none\'">开始识别</button>';dialog.querySelector('[type=file]').onchange=e=>{for(const f of e.target.files)picture(f.name,dialog.querySelector('.photos'))}}
function saveDraft(){audit.push({event:'save',title:document.querySelector('#final-title').value,sku:document.querySelector('#sku').value,price:[...document.querySelectorAll('.rowprice')].map(e=>e.value),stock:[...document.querySelectorAll('.rowstock')].map(e=>e.textContent),sizes:[...document.querySelectorAll('#sizes .spec')].map(e=>({name:e.dataset.value,weight:e.querySelector('[placeholder=备注]').value})),details:[...document.querySelectorAll('#detail img')].map(e=>e.dataset.filename)});if(saveReply){let message=document.createElement('div');message.textContent='草稿保存成功';app.append(message)}}
list();
</script></body></html>
